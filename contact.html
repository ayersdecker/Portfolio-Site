  <link rel="stylesheet" href="assets/css/mono.css" />
</head>
<body>

  <!-- Ambient glow effects -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <!-- Morphic grid background (monochrome) -->
  <canvas id="morphic-grid" aria-hidden="true"></canvas>

  <header class="site-header">
    <a href="/" class="logo-link" aria-label="Home">
      <!-- DA logo — monochrome variant -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 134 70" role="img" aria-hidden="true">
        <path d="M 60 5 L 30 5 L 30 35 C 37.96 35 45.59 31.84 51.21 26.21 C 56.84 20.59 60 12.96 60 5 Z" transform="rotate(-90,45,20)" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 30 5 L 0 5 L 0 35 C 16.57 35 30 21.57 30 5 Z" transform="rotate(90,15,20)" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 30 35 L 0 35 L 0 65 C 16.57 65 30 51.57 30 35 Z" transform="rotate(-180,15,50)" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 60 35 L 30 35 L 30 65 C 37.96 65 45.59 61.84 51.21 56.21 C 56.84 50.59 60 42.96 60 35 Z" fill="none" stroke="#F0F0EC" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 98 5 L 68 5 L 68 35 C 84.57 35 98 21.57 98 5 Z" transform="rotate(-180,83,20)" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 98 35 L 68 35 L 68 65 C 84.57 65 98 51.57 98 35 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 128 35 L 98 35 L 98 65 C 114.57 65 128 51.57 128 35 Z" transform="rotate(90,113,50)" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 128 5 L 98 5 L 98 35 C 114.57 35 128 21.57 128 5 Z" transform="rotate(-90,113,20)" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/#projects">Projects</a>
      <a href="artworks.html">Artworks</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <a href="/" class="back-link">Back</a>
      <div class="section-label">Incoming Transmission</div>

      <!-- Decorative target icon -->
      <div style="text-align:center; margin-bottom: 2rem; opacity: 0.06;" aria-hidden="true">
        <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <circle cx="40" cy="40" r="35" fill="none" stroke="#F0F0EC" stroke-width="1.5"/>
          <circle cx="40" cy="40" r="22" fill="none" stroke="#A0A0A0" stroke-width="1"/>
          <circle cx="40" cy="40" r="10" fill="none" stroke="#5A5A5A" stroke-width="1"/>
          <circle cx="40" cy="40" r="3" fill="#F0F0EC"/>
          <line x1="40" y1="0" x2="40" y2="15" stroke="#F0F0EC" stroke-width="1"/>
          <line x1="40" y1="65" x2="40" y2="80" stroke="#F0F0EC" stroke-width="1"/>
          <line x1="0" y1="40" x2="15" y2="40" stroke="#F0F0EC" stroke-width="1"/>
          <line x1="65" y1="40" x2="80" y2="40" stroke="#F0F0EC" stroke-width="1"/>
        </svg>
      </div>

      <form class="contact-form" action="https://formspree.io/f/xyyqepya" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
        <button type="submit">Transmit</button>
      </form>
    </section>
  </main>

  <script src="assets/scripts/mono.js"></script>
</body>
</html>
